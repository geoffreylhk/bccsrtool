<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="turnstile-site-key" content="0x4AAAAAAFbqxZNtRgiTPEwO">
  <title>Sign in — BC CSR Screening Tool</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css?v=20261018-heading-motion">
  <link rel="stylesheet" href="auth.css?v=20261020-checklist-spacing">
</head>
<body class="auth-page signin-page">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="index.html"><img src="assets/images/logo.png" alt=""><span>CSR Screening Tool</span></a>
    <div class="nav-links"><a href="about.html">About</a><a href="account.html">Account</a></div>
  </nav>
  <main class="workflow-main narrow-main">
    <section class="card auth-entry" aria-labelledby="authHeading">
      <h1 id="authHeading">Sign into bccsrtool</h1>
      <p id="authStatus" role="status" aria-live="polite">Loading account service…</p>
      <p id="authRetry" hidden><a href="signin.html">Return to sign in</a></p>
      <noscript>Enable JavaScript to use accounts.</noscript>
      <button id="googleSigninButton" class="secondary-action" type="button" disabled><img class="google-signin-logo" src="assets/icons/google-logo.png" alt="" width="20" height="20" aria-hidden="true"><span>Continue with Google</span></button>
      <div class="auth-divider"><span>or</span></div>
<form id="signinForm" class="auth-entry-form">
<div class="form-group"><label for="signinEmail">Email</label><input id="signinEmail" name="email" type="email" autocomplete="email" required></div>
<div class="form-group"><label for="signinPassword">Password</label><input id="signinPassword" name="password" type="password" autocomplete="current-password" required></div>
<div class="auth-captcha" data-auth-captcha hidden><p data-captcha-status role="status" aria-live="polite"></p><div data-captcha-widget></div></div>
<button class="primary-action" type="submit" disabled>Sign in</button>
</form>
      <nav class="auth-entry-links" aria-label="Sign-in help">
        <p>Don’t have an account? <a href="signup.html">Sign up</a></p>
        <a href="forgot-password.html">Forgot your password?</a>
      </nav>
      <p class="auth-entry-legal">Read the <a href="termsofuse.html">Terms of Use</a> and <a href="privacypolicy.html">Privacy Policy</a>.</p>
    </section>
  </main>
  <script src="data-utils.js?v=20261018-csv-only"></script>
  <script src="auth-captcha.js?v=20261019-turnstile-1"></script>
  <script src="auth-validation.js?v=20261020-checklist-spacing"></script>
  <script type="module" src="auth.js?v=20261020-password-rules"></script>
  <script type="module" src="assessment-session.js?v=20261018-email-confirmation"></script>
</body>
</html>
