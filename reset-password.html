<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Reset your password — BC CSR Screening Tool</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css?v=20261018-heading-motion">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="index.html"><img src="assets/images/logo.png" alt=""><span>CSR Screening Tool</span></a>
    <div class="nav-links"><a href="about.html">About</a><a href="account.html">Account</a></div>
  </nav>
  <main class="workflow-main narrow-main">
    <header class="page-header"><h1>Reset your password</h1></header>
    <p id="authStatus" role="status" aria-live="polite">Loading account service…</p>
    <p id="authRetry" hidden><a href="signin.html">Return to sign in</a></p>
    <noscript>Enable JavaScript to use accounts.</noscript>
    <form id="resetForm" class="card form-card" hidden>
<div class="form-group"><label for="resetPassword">New password (at least 12 characters)</label><input id="resetPassword" name="password" type="password" autocomplete="new-password" minlength="12" required></div>
<div class="form-group"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></div>
<button class="primary-action" type="submit" disabled>Update password</button>
</form>
<p><a href="signin.html">Return to sign in</a></p>
  </main>
  <script src="data-utils.js?v=20261018-csv-only"></script>
  <script type="module" src="auth.js?v=20261018-signin-redirect"></script>
  <script type="module" src="assessment-session.js?v=20261018-email-confirmation"></script>
</body>
</html>
